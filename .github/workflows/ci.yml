# Every push and pull request: type-check, unit tests, production build.
# Public repo → GitHub-hosted Linux runners are free.
name: CI

on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: tsc · unit tests · build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # `next build` only needs these to exist; nothing connects to a database.
      DATABASE_URL: postgresql://u:p@localhost:5432/unused
      AUTH_SECRET: ci-placeholder-secret
      NEXTAUTH_URL: http://localhost:3000
      PAYMENT_PROCESSOR: manual
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Prisma client
        run: npx prisma generate

      # The deploy refuses a schema change that destroys data unless it is
      # listed in prisma/approved-drops.txt (scripts/db-push-guarded.ts).
      # This is the same check at push time, compared against origin/main
      # (scripts/check-schema-drops.ts).
      - name: Schema drop guard
        run: |
          git fetch --no-tags --depth=1 origin main
          git show origin/main:prisma/schema.prisma > /tmp/base.prisma || true
          npx tsx scripts/check-schema-drops.ts /tmp/base.prisma

      - name: Type-check
        run: npx tsc --noEmit -p tsconfig.json

      - name: Unit tests
        run: npm run test:unit

      # Design guards: no unbridged dark-mode colors in the app tree, and
      # every hand-drawn arrow head clears its shaft (scripts/check-*.mjs).
      - name: Design guards
        run: npm run check:design

      - name: Build
        run: npx next build
