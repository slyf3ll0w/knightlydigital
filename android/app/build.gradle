apply plugin: 'com.android.application'
apply plugin: 'org.jetbrains.kotlin.android'

// Upload-key signing for Play releases. The keystore + passwords live in
// android/keystore.properties (gitignored — see that file's template in
// docs/plans/mobile-app-runbook-mac.md § PLAY STORE). Google Play App Signing
// holds the real app signing key; this upload key only authenticates uploads,
// so it's resettable through Play Console support if ever lost. Builds
// without the properties file (CI, other machines) still work, just unsigned.
def firebaseMessagingVersion = project.hasProperty('firebaseMessagingVersion') ? rootProject.ext.firebaseMessagingVersion : '25.0.1'
def keystorePropsFile = rootProject.file('keystore.properties')
def keystoreProps = new Properties()
if (keystorePropsFile.exists()) {
    keystorePropsFile.withInputStream { keystoreProps.load(it) }
}

android {
    namespace = "com.streamflaire.hub"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.streamflaire.hub"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 6
        versionName "1.4"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        if (keystorePropsFile.exists()) {
            release {
                storeFile file(keystoreProps['storeFile'])
                storePassword keystoreProps['storePassword']
                keyAlias keystoreProps['keyAlias']
                keyPassword keystoreProps['keyPassword']
            }
        }
    }
    buildTypes {
        debug {
            // Sandbox test build: src/debug/res overrides square_application_id with the
            // SANDBOX id; point the shell at staging with WB_SHELL_URL at cap sync time.
            versionNameSuffix '-sandbox'
        }
        release {
            // R8: Play flagged the vc5 upload ("DEX optimization below threshold",
            // enforced from Feb 2027). Shrinks + obfuscates; keep rules in
            // proguard-rules.pro; the mapping file rides inside the AAB
            // (BUNDLE-METADATA) so Play de-obfuscates crash traces by itself.
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (keystorePropsFile.exists()) {
                signingConfig signingConfigs.release
            }
        }
    }
}

kotlin {
    compilerOptions {
        // Matches capacitor.build.gradle's Java 21 compileOptions.
        jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_21
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    // Square Mobile Payments SDK — Tap to Pay on Android (TapToPayPlugin.java).
    // Square supports each version for 2 years; bump deliberately, with a device test.
    implementation 'com.squareup.sdk:mobile-payments-sdk:2.6.1'
    // Sandbox-only simulated reader for debug builds (TapToPayPlugin shows it after a
    // sandbox authorize). Never in release: the plugin reaches the class by reflection.
    debugImplementation 'com.squareup.sdk:mockreader-ui:2.6.1'
    // Business-line calls with the app closed (VoipEngine.kt, CallService.kt):
    // the Telnyx Android WebRTC SDK (JitPack; the iPhone uses telnyx-webrtc-ios
    // the same way), coroutines for its flows, and Firebase Messaging so the
    // engine can read the FCM token itself (the push plugin keeps its copy
    // private). firebaseMessagingVersion comes from the push plugin's gradle.
    implementation 'com.github.team-telnyx:telnyx-webrtc-android:3.7.3'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.11.0'
    implementation "com.google.firebase:firebase-messaging:$firebaseMessagingVersion"
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
