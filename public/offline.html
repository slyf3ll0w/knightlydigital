<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#F5F7FA" media="(prefers-color-scheme: light)" />
<meta name="theme-color" content="#0F1318" media="(prefers-color-scheme: dark)" />
<title>WorkBench</title>
<!-- Served by the service worker (public/sw.js) when a page was never
     visited while online and the network isn't answering. Fully
     self-contained: no fonts, images, or scripts fetched — we may be offline.
     Styled like the app (app/ds.css neutrals; Lexend when the browser already
     has it cached, the system font otherwise).

     Two states: while the browser says it is ONLINE this is a blip (a phone
     that just woke up drops its first requests), so it shows "Opening…" and
     retries on its own at 1 s, 3 s and 7 s before asking anyone to press a
     button. Offline, or after those retries, it says so. -->
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    background: #F5F7FA;
    color: #0A1328;
    font-family: Lexend, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    padding-top: calc(24px + env(safe-area-inset-top));
    padding-bottom: calc(24px + env(safe-area-inset-bottom));
    text-align: center;
    -webkit-font-smoothing: antialiased;
  }
  .wrap { max-width: 22rem; width: 100%; }
  .card {
    background: #FFFFFF;
    border: 1px solid #E7EBF1;
    border-radius: 16px;
    padding: 28px 22px 24px;
    box-shadow: 0 1px 2px rgba(10, 19, 40, 0.04), 0 8px 24px rgba(10, 19, 40, 0.06);
  }
  .spin {
    width: 30px; height: 30px; margin: 0 auto 16px;
    border-radius: 50%;
    border: 3px solid #E7EBF1;
    border-top-color: #0A1328;
    animation: r .8s linear infinite;
  }
  @keyframes r { to { transform: rotate(360deg); } }
  .badge {
    width: 52px; height: 52px; margin: 0 auto 16px;
    border-radius: 14px;
    border: 1px solid #E7EBF1;
    background: #F7F9FC;
    display: flex; align-items: center; justify-content: center;
    color: #687589;
  }
  h1 { font-size: 1.1rem; font-weight: 600; letter-spacing: -0.01em; margin-bottom: 8px; }
  p { font-size: 0.9rem; line-height: 1.5; color: #687589; }
  .actions { margin-top: 22px; display: flex; flex-direction: column; gap: 10px; align-items: center; }
  button, a.link {
    font: inherit; font-weight: 600; font-size: 0.9rem;
    border: 0; border-radius: 10px; cursor: pointer; text-decoration: none;
    padding: 11px 22px; min-width: 9rem;
  }
  button { color: #FFFFFF; background: #0A1328; }
  button:active { background: #1E2A44; }
  a.link { color: #3A475C; background: transparent; padding: 6px 10px; min-width: 0; }
  a.link:active { color: #0A1328; }
  [hidden] { display: none !important; }
  @media (prefers-color-scheme: dark) {
    body { background: #0F1318; color: #EDF1F6; }
    .card { background: #1A1F26; border-color: #2A313B; box-shadow: none; }
    .spin { border-color: #2A313B; border-top-color: #EDF1F6; }
    .badge { background: #222933; border-color: #2A313B; color: #8C95A2; }
    p { color: #8C95A2; }
    button { color: #0F1318; background: #EDF1F6; }
    button:active { background: #D6DCE5; }
    a.link { color: #B6BFCB; }
  }
</style>
</head>
<body>
  <div class="wrap">
    <div class="card">
      <div id="opening">
        <div class="spin" aria-hidden="true"></div>
        <h1>Opening…</h1>
        <p>Reaching WorkBench.</p>
      </div>
      <div id="stuck" hidden>
        <div class="badge" aria-hidden="true">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="2" x2="22" y1="2" y2="22"/><path d="M8.5 16.5a5 5 0 0 1 7 0"/><path d="M2 8.82a15 15 0 0 1 4.17-2.65"/><path d="M10.66 5c4.01-.36 8.14.9 11.34 3.76"/><path d="M16.85 11.25a10 10 0 0 1 2.22 1.68"/><path d="M5 13a10 10 0 0 1 5.24-2.76"/><line x1="12" x2="12.01" y1="20" y2="20"/>
          </svg>
        </div>
        <h1 id="stuck-title">You&rsquo;re offline</h1>
        <p id="stuck-copy">This page isn&rsquo;t saved on this device yet. Pages you open while connected stay available offline.</p>
        <div class="actions">
          <button type="button" onclick="location.reload()">Try again</button>
          <a class="link" href="/app/dashboard">Go to Home</a>
        </div>
      </div>
    </div>
  </div>
  <script>
    (function () {
      var opening = document.getElementById("opening");
      var stuck = document.getElementById("stuck");
      var title = document.getElementById("stuck-title");
      var copy = document.getElementById("stuck-copy");
      var RETRY_AT = [1000, 3000, 7000];
      var timers = [];

      function showStuck(online) {
        for (var i = 0; i < timers.length; i++) clearTimeout(timers[i]);
        timers = [];
        if (online) {
          title.textContent = "Still can’t reach WorkBench";
          copy.textContent = "Your connection looks fine but the page didn’t load. Try again, or open Home and come back to it.";
        } else {
          title.textContent = "You’re offline";
          copy.textContent = "This page isn’t saved on this device yet. Pages you open while connected stay available offline — it will open on its own once you have signal.";
        }
        opening.hidden = true;
        stuck.hidden = false;
      }

      function startRetries() {
        opening.hidden = false;
        stuck.hidden = true;
        for (var i = 0; i < RETRY_AT.length; i++) {
          timers.push(setTimeout(function () { location.reload(); }, RETRY_AT[i]));
        }
        // Still here after the last retry had its chance: the network is up
        // but the app isn't answering — say so instead of spinning forever.
        timers.push(setTimeout(function () { showStuck(true); }, RETRY_AT[RETRY_AT.length - 1] + 2500));
      }

      // Each reload lands back here while the fetch keeps failing; count the
      // visits in this tab so the retries don't restart from scratch every time.
      var visits = 0;
      try {
        visits = Number(sessionStorage.getItem("wb-offline-visits") || "0") + 1;
        sessionStorage.setItem("wb-offline-visits", String(visits));
        setTimeout(function () { try { sessionStorage.removeItem("wb-offline-visits"); } catch (e) {} }, 60000);
      } catch (e) {}

      if (!navigator.onLine) showStuck(false);
      else if (visits > 3) showStuck(true);
      else startRetries();

      // The moment connectivity returns, load the page they actually wanted
      window.addEventListener("online", function () { location.reload(); });
    })();
  </script>
</body>
</html>
